<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alphabet Adventure</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f4eb;color:#40564f;font-family:Arial,'Microsoft JhengHei',sans-serif}main{max-width:1050px;margin:auto;padding:16px}h1{text-align:center;margin:8px 0}header p{text-align:center}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 16px;background:#52796e;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.secondary{background:#e5eae2;color:#40564f}button:focus-visible,input:focus-visible{outline:3px solid #b77c43}section{background:#fffdf8;border-radius:18px;padding:16px;margin:12px 0}label{display:inline-flex;gap:6px;align-items:center;margin:5px}input[type=text]{width:135px;padding:8px;border:1px solid #b9c8bd;border-radius:8px}.letters{display:flex;flex-wrap:wrap;gap:5px}.letters label{background:#e1ebdf;border-radius:8px;padding:7px;margin:0}.toolbar,.players,.answers{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));gap:4px;aspect-ratio:1;max-width:760px;margin:12px auto}.tile{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:9px;background:#dce9dd;min-width:0;overflow:hidden;padding-bottom:12px;font-weight:bold;font-size:clamp(10px,2.8vw,25px)}.tile small{font-size:clamp(7px,1.5vw,12px)}.tokens{position:absolute;bottom:3px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}.token{width:clamp(9px,1.7vw,17px);height:clamp(9px,1.7vw,17px);border:1px solid white;border-radius:50%;color:#fff;font-size:9px;text-align:center}.center{grid-area:2/2/9/9;background:#fffdf8;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px}.center h2{margin:0;font-size:clamp(14px,3vw,28px)}#die{background:white;box-shadow:0 5px 0 #c5d3c8;color:#40564f;width:clamp(55px,18vw,120px);aspect-ratio:1;padding:12px}#die svg{width:100%;height:100%}.player{padding:8px;border:2px solid transparent;border-radius:10px;background:#f0f1e9}.player.active{border-color:var(--color)}#task{text-align:center;min-height:100px}#question{font-size:22px;font-weight:bold}.answers{justify-content:center}.answers button{min-width:75px;font-size:20px}.answers button.correct{background:#39794e}.answers button.wrong{background:#b75c59}#feedback{min-height:25px;font-weight:bold} [hidden]{display:none!important}@media(max-width:480px){main{padding:8px}.board{gap:2px}.tile{border-radius:4px}.center{gap:4px}.center button{padding:7px;font-size:12px}.center h2{font-size:15px}section{padding:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><header><h1>🌿 Alphabet Adventure</h1><p>Roll · Move · Say · Learn</p></header><section id="setup"><h2>遊戲設定</h2><label>玩家人數 <select id="number"></select></label><div id="names"></div><p>選擇已學過的字母：</p><div class="toolbar"><button class="secondary" id="all">全選</button><button class="secondary" id="none">清除</button><button class="secondary" id="ae">A–E</button></div><div class="letters" id="letters"></div><p><label>答題模式 <select id="mode"><option value="match">大小寫配對</option><option value="listen">聽音選字母</option><option value="word">單字首字母</option></select></label></p><p id="error" role="alert"></p><button id="start">Start Game</button></section><div id="game" hidden><div class="toolbar"><button id="sound" class="secondary">🔊 Sound ON</button><button id="full" class="secondary">全螢幕</button><button id="restart" class="secondary">重新設定</button></div><div id="board" class="board"></div><div id="players" class="players"></div><section id="task"><div id="question" aria-live="polite"></div><p id="instruction"></p><button id="listen" hidden>🔊 Listen</button><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Next Player</button></section></div></main><script>
'use strict';const $=id=>document.getElementById(id),alphabet=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],colors=['#c76c70','#638bb7','#b58a39','#659873','#9876b3','#c17e50'];const words=['apple','ball','cat','dog','egg','fish','goat','hat','igloo','jam','kite','lion','moon','nest','octopus','pig','queen','rabbit','sun','tiger','umbrella','van','wolf','xylophone','yo-yo','zebra'];const faces=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];const rand=n=>Math.floor(Math.random()*n),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};const sleep=ms=>new Promise(r=>setTimeout(r,ms));let selected=[],tiles=[],players=[],turn=0,phase='setup',extra=false,sound=true,ctx,epoch=0,listenWord='',mode='match';
for(let n=2;n<=6;n++)$('number').add(new Option(n,n));function names(){let old=[...$('names').querySelectorAll('input')].map(x=>x.value);$('names').replaceChildren();for(let i=0;i<+$('number').value;i++){let l=document.createElement('label'),x=document.createElement('input');l.textContent='P'+(i+1);x.type='text';x.maxLength=18;x.value=old[i]||'Player '+(i+1);l.append(x);$('names').append(l)}}$('number').onchange=names;names();alphabet.forEach(a=>{let l=document.createElement('label'),x=document.createElement('input');x.type='checkbox';x.value=a;x.checked=true;l.append(x,a);$('letters').append(l)});function selectLetters(a){$('letters').querySelectorAll('input').forEach(x=>x.checked=a.includes(x.value))}$('all').onclick=()=>selectLetters(alphabet);$('none').onclick=()=>selectLetters([]);$('ae').onclick=()=>selectLetters(alphabet.slice(0,5));
function audio(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{})}catch(e){}}function tone(f=330,d=.07){if(!sound||!ctx)return;try{let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}function speak(w){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}function draw(n){$('pips').innerHTML=faces[n-1].map(d=>`<circle cx="${18+d%3*32}" cy="${18+Math.floor(d/3)*32}" r="9" fill="#40564f"/>`).join('')}
function build(){let pool=[];while(pool.length<26)pool.push(...shuffle(selected));let k=0;tiles=Array.from({length:32},(_,i)=>({type:'letter',text:pool[k++]}));k=0;const specials={0:['start','START'],6:['forward','+2'],12:['back','−2'],18:['skip','STOP'],24:['again','AGAIN'],31:['finish','FINISH']};tiles=tiles.map((_,i)=>specials[i]?{type:specials[i][0],text:specials[i][1]}:{type:'letter',text:pool[k++]});let coords=[];for(let c=1;c<=9;c++)coords.push([9,c]);for(let r=8;r>=1;r--)coords.push([r,9]);for(let c=8;c>=1;c--)coords.push([1,c]);for(let r=2;r<=8;r++)coords.push([r,1]);$('board').replaceChildren();tiles.forEach((t,i)=>{let d=document.createElement('div');d.className='tile';d.style.gridRow=coords[i][0];d.style.gridColumn=coords[i][1];d.style.background=({start:'#f3dfac',finish:'#f3dfac',forward:'#bcdcc4',back:'#efd1ca',skip:'#f2e3c2',again:'#ded4ed',letter:i%2?'#dce9dd':'#dce7f0'})[t.type];let s=document.createElement(t.type==='letter'?'span':'small');s.textContent=t.type==='letter'?t.text+t.text.toLowerCase():t.text;let tokens=document.createElement('div');tokens.className='tokens';tokens.id='tile'+i;d.append(s,tokens);$('board').append(d)});let c=document.createElement('div');c.className='center';c.innerHTML='<h2 id="whose"></h2><button id="die" aria-label="Roll the dice"><svg id="pips" viewBox="0 0 100 100"></svg></button><button id="roll">🎲 Roll the Dice</button><div id="rolled">Ready?</div>'; $('board').append(c);$('die').onclick=$('roll').onclick=roll;draw(1)}
function render(){tiles.forEach((_,i)=>$('tile'+i).replaceChildren());players.forEach((p,i)=>{let t=document.createElement('span');t.className='token';t.style.background=colors[i];t.textContent=i+1;t.title=p.name;$('tile'+p.pos).append(t)});$('players').replaceChildren();players.forEach((p,i)=>{let d=document.createElement('div');d.className='player'+(i===turn?' active':'');d.style.setProperty('--color',colors[i]);d.textContent=`● ${p.name} · ${p.score} 分${p.skip?' ⏸':''}`;d.style.color=colors[i];$('players').append(d)});$('whose').textContent=phase==='won'?'🏆 '+players[turn].name:players[turn].name+"'s turn";$('die').disabled=$('roll').disabled=phase!=='ready'}
function message(q,ins=''){$('question').textContent=q;$('instruction').textContent=ins;$('answers').replaceChildren();$('feedback').textContent='';$('listen').hidden=true;$('next').hidden=true;listenWord=''}function ready(note=''){phase='ready';message(players[turn].name+'，請擲骰子！',note);render()}function finish(){phase='won';message('🏆 '+players[turn].name+' wins!','恭喜抵達終點！');tone(880,.4);speak('Congratulations!');render()}function endTurn(){phase='next';$('next').hidden=false;$('next').textContent=extra?'Roll Again':'Next Player';render()}
async function move(p,to,e){while(p.pos!==to){if(e!==epoch)return false;p.pos+=Math.sign(to-p.pos);render();tone(330);await sleep(130)}return e===epoch}
async function roll(){if(phase!=='ready')return;audio();phase='moving';extra=false;let e=epoch,p=players[turn];message('Rolling…');render();let n=1;for(let i=0;i<12;i++){if(e!==epoch)return;n=rand(6)+1;draw(n);tone(140+rand(200));await sleep(75)}if(e!==epoch)return;$('rolled').textContent='You rolled '+n+'!';speak(['One','Two','Three','Four','Five','Six'][n-1]);if(!await move(p,Math.min(31,p.pos+n),e))return;let t=tiles[p.pos];if(t.type==='forward'||t.type==='back'){let delta=t.type==='forward'?2:-2;message(delta>0?'Go forward 2 spaces!':'Go back 2 spaces!');await sleep(650);if(!await move(p,Math.max(0,Math.min(31,p.pos+delta)),e))return;t=tiles[p.pos]}if(t.type==='finish'){finish();return}if(t.type==='letter'){quiz(t.text);return}if(t.type==='skip'){p.skip=true;message('Miss a turn!','下一輪暫停一次。');speak('Miss a turn')}else if(t.type==='again'){extra=true;message('Roll again!','再擲一次骰子。');speak('Roll again')}else message('Keep going!');endTurn()}
function quiz(a){phase='quiz';let choices=shuffle([a,...shuffle(selected.filter(x=>x!==a)).slice(0,3)]);if(mode==='listen'){message('Listen and choose.','聽字母名稱，選出正確字母。');listenWord=a;$('listen').hidden=false;speak(a)}else if(mode==='word'){message(a+' '+a.toLowerCase(),'Which word starts with this letter?')}else message(a,'Choose the matching lowercase letter.');choices.forEach(x=>{let b=document.createElement('button');b.textContent=mode==='word'?words[alphabet.indexOf(x)]:mode==='match'?x.toLowerCase():x;b.onclick=()=>answer(x===a,b,a);b.dataset.letter=x;$('answers').append(b)});render()}
async function answer(ok,b,a){if(phase!=='quiz')return;phase='moving';let e=epoch;[...$('answers').children].forEach(x=>{x.disabled=true;if(x.dataset.letter===a)x.classList.add('correct')});if(ok){players[turn].score+=10;$('feedback').textContent='Great job! +10 points';tone(660,.2);speak('Great job!')}else{b.classList.add('wrong');$('feedback').textContent='Nice try! Go back one space.';tone(220,.2);speak('Nice try');await sleep(600);if(e!==epoch)return;let p=players[turn];if(!await move(p,Math.max(0,p.pos-1),e))return}if(e===epoch)endTurn()}
$('next').onclick=()=>{if(phase!=='next')return;let skipped=[];if(!extra){do{turn=(turn+1)%players.length;if(!players[turn].skip)break;players[turn].skip=false;skipped.push(players[turn].name)}while(true)}extra=false;ready(skipped.length?skipped.join('、')+' 暫停一輪。':'')};$('listen').onclick=()=>{audio();if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(listenWord);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sound ON':'🔇 Sound OFF';if(sound)audio();else if(window.speechSynthesis)speechSynthesis.cancel()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else alert('此瀏覽器不支援全螢幕，請使用瀏覽器的全螢幕功能。')}catch(e){alert('此裝置無法開啟全螢幕。')}};$('restart').onclick=()=>{if(!confirm('結束本局並重新設定？'))return;epoch++;phase='setup';if(window.speechSynthesis)speechSynthesis.cancel();$('game').hidden=true;$('setup').hidden=false};$('start').onclick=()=>{selected=[...$('letters').querySelectorAll('input:checked')].map(x=>x.value);if(selected.length<2){$('error').textContent='請至少選擇兩個字母，才能產生選擇題。';return}mode=$('mode').value;if(mode==='listen'&&!window.speechSynthesis){$('error').textContent='此瀏覽器不支援語音，請選擇其他模式。';return}$('error').textContent='';epoch++;audio();players=[...$('names').querySelectorAll('input')].map((x,i)=>({name:x.value.trim()||'Player '+(i+1),pos:0,score:0,skip:false}));turn=0;extra=false;$('setup').hidden=true;$('game').hidden=false;build();ready()};
</script></body></html>
